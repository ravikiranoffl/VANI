name: VANI Production Build

# 1. Trigger the robot whenever you push to your main branch
on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 2. Download your raw source code into the virtual machine
      - name: Checkout Source Code
        uses: actions/checkout@v3

      # 3. Boot up a Node.js environment
      - name: Setup Node Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 4. Install industry-standard command-line minifiers
      - name: Install Minification Engines
        run: npm install -g uglify-js clean-css-cli

      # 5. Crush and compile the raw files into .min files
      - name: Minify Matrix Assets
        run: |
          uglifyjs script.js -o script.min.js -m -c
          cleancss -o style.min.css style.css

      # 6. 🚨 SURGICAL STRIKE: Swap the filenames inside index.html dynamically
      - name: Rewire HTML to use Minified Assets
        run: |
          sed -i 's/script.js/script.min.js/g' index.html
          sed -i 's/style.css/style.min.css/g' index.html

      # 7. Deploy the optimized bundle to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ 
          publish_branch: gh-pages # Creates an isolated branch just for the live website
